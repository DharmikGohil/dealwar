services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealwar
      POSTGRES_USER: dealwar
      POSTGRES_PASSWORD: dealwar
    ports:
      - "5434:5432"
    volumes:
      - dealwar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealwar -d dealwar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealwar_postgres:
