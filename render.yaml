services:
  - type: web
    name: dealwar
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build && mkdir -p .next/standalone/.next && cp -R .next/static .next/standalone/.next/static && npm run db:deploy
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_APP_URL
        value: https://dealwar.dharmikgohil.in
      - key: BETTER_AUTH_URL
        value: https://dealwar.dharmikgohil.in
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ABUSE_HASH_SECRET
        generateValue: true
      - key: COUPON_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: DEAL_ENTRY_FEE_CENTS
        value: "1900"
      - key: OBJECT_STORAGE_ENDPOINT
        value: https://sttmgihpfcuwtmdiyyoa.storage.supabase.co/storage/v1/s3
      - key: OBJECT_STORAGE_REGION
        value: ap-southeast-1
      - key: OBJECT_STORAGE_BUCKET
        value: dealwar-assets
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_URL
        value: https://sttmgihpfcuwtmdiyyoa.supabase.co/storage/v1/object/public/dealwar-assets
      - key: ADMIN_EMAILS
        sync: false
      - key: CRON_SECRET
        generateValue: true
